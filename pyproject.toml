[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "retrieval-compression-lab"
version = "0.1.0"
description = "Independent, reproducible frozen-embedding compression baselines for COMP5331"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=1.26,<3",
  "torch>=2.3,<3",
  "sentence-transformers>=3,<6",
  "huggingface-hub>=0.25,<2",
  "faiss-cpu>=1.8,<2",
  "matplotlib>=3.8,<4",
  "threadpoolctl>=3.5,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "scikit-learn>=1.5,<2", "ruff>=0.8,<1"]

[project.scripts]
retrieval-lab = "retrieval_lab.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/retrieval_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
